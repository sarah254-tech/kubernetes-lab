apiVersion: apps/v1
kind: Deployment
metadata:
  name: autohealing-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autohealing-nginx
  template:
    metadata:
      labels:
        app: autohealing-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
